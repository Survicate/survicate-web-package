name: Publish to NPM

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes. Leave empty to reuse the matching module-surveys-web release title.'
        required: false

concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

env:
  STATIC_REPO: Survicate/module-surveys-web

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Refuse to run outside development
        if: github.ref_name != 'development'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::This workflow publishes from development only; it was started on ${REF_NAME}."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} cannot use trusted publishing; 11.5.1 or newer is required."
            exit 1
          fi

      - name: Read package version
        id: pkg
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version '${version}' is not a plain semver version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Inspect release state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          published=false
          tagged=false
          released=false
          notes_empty=true
          if [ -n "$(npm view "${PKG}@${VERSION}" version 2>/dev/null || true)" ]; then
            published=true
          fi
          if git ls-remote --exit-code --tags --refs origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            tagged=true
          fi
          if body="$(gh release view "$VERSION" --json body --jq .body 2>/dev/null)"; then
            released=true
            if [ -n "$body" ]; then
              notes_empty=false
            fi
          fi
          if [ "$released" = "false" ] || [ "$notes_empty" = "true" ] || [ -n "${MANUAL_NOTES:-}" ]; then
            notes_needed=true
          else
            notes_needed=false
          fi
          {
            echo "published=${published}"
            echo "tagged=${tagged}"
            echo "released=${released}"
            echo "notes_needed=${notes_needed}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${PKG}@${VERSION}"
            echo ""
            echo "| already on npm | already tagged | release exists | notes to resolve |"
            echo "| --- | --- | --- | --- |"
            echo "| ${published} | ${tagged} | ${released} | ${notes_needed} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safety check
        if: steps.state.outputs.published == 'false'
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e "
            let raw = '';
            process.stdin.on('data', chunk => raw += chunk).on('end', () => {
              const files = JSON.parse(raw)[0].files.map(file => file.path);
              console.log('Package contents: ' + files.join(', '));
              const risky = /(^|\/)\.env(\..+)?\$|(^|\/)\.npmrc\$|(^|\/)(id_rsa|id_ed25519)\$|\.(pem|key)\$|(^|\/)(credentials|secrets?)(\.(json|ya?ml|env|txt))?\$/i;
              const found = files.filter(file => risky.test(file));
              if (found.length > 0) {
                console.error('::error::Sensitive files detected in npm package: ' + found.join(', '));
                process.exit(1);
              }
            });
          "

      - name: Publish
        if: steps.state.outputs.published == 'false'
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create git tag
        if: steps.state.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Resolve release notes
        id: notes
        if: steps.state.outputs.notes_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          MANUAL_NOTES: ${{ inputs.release_notes }}
          AUTOMATED: ${{ github.event_name == 'push' }}
          ATTEMPTS: '20'
        run: |
          notes=""
          error_log="${RUNNER_TEMP}/gh-release-view.log"
          if [ -n "${MANUAL_NOTES:-}" ]; then
            notes="$MANUAL_NOTES"
          elif [ -z "${GH_TOKEN:-}" ]; then
            if [ "$AUTOMATED" = "true" ]; then
              echo "::error::No token with read access to ${STATIC_REPO}. Add the GH_TOKEN secret, or dispatch this workflow with release notes."
              exit 1
            fi
            echo "::warning::No token with read access to ${STATIC_REPO}; releasing without notes."
          else
            for attempt in $(seq 1 "$ATTEMPTS"); do
              if title="$(gh release view "$VERSION" --repo "$STATIC_REPO" --json name --jq .name 2>"$error_log")" && [ -n "$title" ]; then
                notes="${title#"$VERSION" }"
                break
              fi
              if grep -qiE 'HTTP 40[13]|bad credentials|authentication' "$error_log"; then
                echo "::error::Cannot read ${STATIC_REPO} releases: $(tr '\n' ' ' < "$error_log")"
                exit 1
              fi
              if [ "$attempt" -lt "$ATTEMPTS" ]; then
                echo "No ${STATIC_REPO} release for ${VERSION} yet (attempt ${attempt}/${ATTEMPTS}); waiting 30s."
                sleep 30
              fi
            done
            if [ -z "$notes" ]; then
              if [ "$AUTOMATED" = "true" ]; then
                echo "::error::No ${STATIC_REPO} release for ${VERSION} after 10 minutes. Cut it, then re-run this workflow to finish the release."
                exit 1
              fi
              echo "::warning::No ${STATIC_REPO} release for ${VERSION} after 10 minutes; releasing without notes."
            fi
          fi
          delimiter="RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            echo "notes<<${delimiter}"
            printf '%s\n' "$notes"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        if: steps.state.outputs.notes_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          RELEASED: ${{ steps.state.outputs.released }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "$notes_file"
          if [ "$RELEASED" = "true" ]; then
            gh release edit "$VERSION" --notes-file "$notes_file"
            echo "Updated the notes on release ${VERSION}: ${RELEASE_NOTES:-(empty)}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file "$notes_file"
            echo "Created release ${VERSION}: ${RELEASE_NOTES:-(empty)}" >> "$GITHUB_STEP_SUMMARY"
          fi
